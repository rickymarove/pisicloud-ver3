<section class="relative overflow-hidden bg-gradient-to-b from-[#EBF7F4] via-[#F5FAF8]/80 to-white pt-12 pb-8 sm:pt-16 md:pt-20 lg:pt-24">
  <!-- Subtle ambient decorative glow circles -->
  <div class="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 h-96 w-[720px] max-w-full rounded-full bg-[#D4EFE9]/40 blur-3xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute top-12 left-10 h-64 w-64 rounded-full bg-[#E0F5F0]/60 blur-2xl" aria-hidden="true"></div>
  <div class="pointer-events-none absolute top-16 right-10 h-64 w-64 rounded-full bg-[#D8F2EC]/50 blur-2xl" aria-hidden="true"></div>

  <div class="relative max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <!-- Hero Headline: Inter, Bold (Weight 700), Locked to 2 Lines -->
    <h1 class="font-sans font-bold font-[700] text-[#182849] text-3xl sm:text-4xl md:text-5xl lg:text-[54px] xl:text-[58px] tracking-tight leading-[1.15] sm:leading-[1.18]">
      <span class="block whitespace-normal sm:whitespace-nowrap">{{ 'HERO.TITLE_LINE1' | translate }}</span>
      <span class="block whitespace-nowrap mt-0.5 sm:mt-1">
        <span class="text-[#0E6C5E]">{{ 'HERO.BRAND' | translate }}</span> {{ 'HERO.TITLE_LINE2_SUFFIX' | translate }}
      </span>
    </h1>

    <!-- Hero Subtitle: DM Sans, Regular (Weight 400), Single Line on Desktop -->
    <p class="mt-5 sm:mt-7 max-w-5xl mx-auto font-display font-normal font-[400] text-[#4B5563] text-sm sm:text-base md:text-[17px] lg:text-[18px] leading-relaxed tracking-[-0.01em] whitespace-normal lg:whitespace-nowrap">
      {{ 'HERO.SUBTITLE' | translate }}
    </p>

    <!-- Action Buttons -->
    <div class="mt-8 sm:mt-10 flex flex-col sm:flex-row items-center justify-center gap-3.5 sm:gap-4.5">
      <a
        href="#contact"
        (click)="onContactUs()"
        class="w-full sm:w-auto inline-flex items-center justify-center px-7 py-3.5 rounded-xl bg-[#0E6C5E] text-white text-[15px] sm:text-base font-semibold shadow-xs hover:bg-[#0b5449] hover:shadow-md active:scale-[0.98] transition-all duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0E6C5E]"
      >
        {{ 'HERO.CTA_PRIMARY' | translate }}
      </a>
      <button
        type="button"
        (click)="onWatchVideo()"
        class="w-full sm:w-auto inline-flex items-center justify-center px-7 py-3.5 rounded-xl border border-[#0E6C5E] bg-white text-[#0E6C5E] text-[15px] sm:text-base font-semibold shadow-2xs hover:bg-[#0E6C5E]/6 hover:shadow-xs active:scale-[0.98] transition-all duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0E6C5E]"
      >
        {{ 'HERO.CTA_SECONDARY' | translate }}
      </button>
    </div>

    <!-- Product Preview Frame Edge (as seen in Figma design) -->
    <div class="mt-12 sm:mt-16 max-w-4xl mx-auto" aria-hidden="true">
      <div class="h-10 sm:h-14 rounded-t-2xl border-t border-x border-gray-200/80 bg-white/80 shadow-xs backdrop-blur-xs"></div>
    </div>
  </div>
</section>
